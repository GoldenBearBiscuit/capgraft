<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CapGraft · 能力嫁接流程</title>
<style>
:root{--bg:#0b0f14;--line:#1f5c3a;--acc:#3ddc84;--dim:#5a7a68;--sel:#ffb454;--warn:#ff6b6b}
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);font:12px Consolas,Menlo,monospace;color:#cfe8d8}
#viewport{position:fixed;inset:0;cursor:grab}
#viewport:active{cursor:grabbing}
#world{position:absolute;left:50%;top:50%;transform-origin:0 0}
/* 连线层：位于节点之下，随 world 一起缩放 */
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#edges path{fill:none;stroke:var(--line);stroke-width:1.5}
#edges path.dash{stroke-dasharray:5 4;stroke:#2a4a3a}
#edges path.warn{stroke:var(--sel)}
#edges path.hot{stroke:var(--acc);stroke-width:2}
#edges text{fill:var(--dim);font:10px Consolas,Menlo,monospace;paint-order:stroke;stroke:var(--bg);stroke-width:4px}
#edges text.hot{fill:var(--acc)}
.node{position:absolute;width:190px;border:1px solid var(--line);background:#101720;border-radius:4px;cursor:pointer;user-select:none}
.node:hover{border-color:var(--acc)}
.node.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.node .hd{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#16202a;border-bottom:1px solid var(--line);color:var(--acc)}
.node .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:blink 2s infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
.node .bd{padding:7px 8px;color:var(--dim);font-size:10px;line-height:1.6}
/* 人审节点：琥珀色；证据存储节点：虚线框 */
.node.human{border-color:#6b5320}
.node.human .hd{color:var(--sel)}
.node.human .dot{background:var(--sel)}
.node.store{border-style:dashed;background:#0d1319}
.node.store .hd{color:var(--dim)}
.node.store .dot{background:var(--dim);animation:none}
#title{position:fixed;top:10px;left:12px;z-index:5;color:var(--acc)}
#title span{color:var(--dim)}
#legend{position:fixed;top:10px;right:12px;z-index:5;color:var(--dim);text-align:right;line-height:1.8;font-size:10px}
#legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--line);vertical-align:middle;margin-right:5px}
#legend i.dash{border-top-style:dashed;border-color:#2a4a3a}
#legend i.warn{border-color:var(--sel)}
#hud{position:fixed;bottom:10px;left:12px;z-index:5;color:var(--dim)}
/* 详情/代码面板：说明与源码共用一个可滚动容器 */
#detail{position:fixed;bottom:10px;right:12px;z-index:5;display:none;width:560px;max-height:78vh;background:#101720;border:1px solid var(--sel);border-radius:4px;font-size:11px;line-height:1.7;flex-direction:column}
#detail.open{display:flex}
#detail .hd{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);color:var(--sel)}
#detail .hd b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#detail .tab{cursor:pointer;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:1px 8px;flex:none}
#detail .tab.on{color:var(--acc);border-color:var(--acc)}
#detail .x{cursor:pointer;color:var(--dim);flex:none}
#detail .x:hover{color:var(--warn)}
#detail .bd{flex:1;min-height:0;overflow:auto;padding:8px 10px;color:#9fb8a8}
#detail .ft{padding:4px 10px;border-top:1px solid var(--line);color:var(--dim);font-size:10px}
#detail pre{font:11px/1.55 Consolas,Menlo,monospace;color:#cfe8d8;background:#0d1319;border:1px solid var(--line);border-radius:3px;padding:6px 8px;overflow-x:auto;margin:4px 0 10px}
#detail .slice{color:var(--acc);margin-top:6px}
#detail .jump{cursor:pointer;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:0 6px;margin:0 4px 4px 0;display:inline-block}
#detail .jump:hover{color:var(--acc);border-color:var(--acc)}
#detail .file{cursor:pointer;display:block;padding:3px 6px;border:1px solid var(--line);border-radius:3px;margin:4px 0;color:#9fb8a8}
#detail .file:hover{color:var(--acc);border-color:var(--acc)}
</style>
</head>

<script id="code-data" type="application/json">{"generated_at":"2026-11-15T09:10:03+00:00","files":{"build_code_view.py":{"lines":["#!/usr/bin/env python3","\"\"\"把项目源码按流程节点注入 capgraft-flow.html，生成可离线浏览的代码视图。","","用法：python build_code_view.py","产物仍是双击即开的单文件 HTML；源码改动后重跑本脚本即可刷新快照。","\"\"\"","","import json","import re","import sys","from datetime import datetime, timezone","from pathlib import Path","","","PROJECT_DIR = Path(__file__).resolve().parent","HTML_PATH = PROJECT_DIR / \"capgraft-flow.html\"","# 占位块：构建时只替换两个标记之间的 JSON，其余 HTML 保持原样。","PLACEHOLDER = re.compile(r'(<script id=\"code-data\" type=\"application/json\">)[\\s\\S]*?(<\/script>)')","# 只识别顶层 def/class，用于切出函数级行号区间（1 起、含端点）。","SYMBOL_PATTERN = re.compile(r\"^(?:def|class)\\s+([A-Za-z_][A-Za-z0-9_]*)\")","# 流程页节点 id 的提取规则，与 HTML 中 nodes 数组的写法保持一致。","NODE_ID_PATTERN = re.compile(r'\\{id:\"([a-z]+)\"')","","# 流程节点 → 源码片段映射；symbol 为 None 表示展示整文件。","# 同一函数可挂在多个节点下（如 _run_verification 同时属于 publish 与 runs）。","NODE_SOURCES = {","    \"friction\": [","        (\"examples/word_count/capability.json\", None),","        (\"capgraft.py\", \"validate_spec\"),","    ],","    \"candidate\": [","        (\"examples/word_count/adapter.py\", None),","        (\"capgraft.py\", \"load_spec\"),","    ],","    \"publish\": [","        (\"capgraft.py\", \"publish\"),","        (\"capgraft.py\", \"_run_verification\"),","    ],","    \"trust\": [","        (\"examples/word_count/trusted.json\", None),","        (\"capgraft.py\", \"install_trusted_gate\"),","        (\"capgraft.py\", \"_load_trusted_gate\"),","    ],","    \"activate\": [","        (\"capgraft.py\", \"activate\"),","        (\"capgraft.py\", \"_check_active_releases\"),","    ],","    \"good\": [","        (\"capgraft.py\", \"_check_known_good_digest\"),","        (\"capgraft.py\", \"_release_digest\"),","        (\"capgraft.py\", \"load_registry\"),","    ],","    \"invoke\": [","        (\"capgraft.py\", \"invoke\"),","        (\"capgraft.py\", \"_call_worker\"),","        (\"capgraft.py\", \"_worker_entry\"),","    ],","    \"verify\": [(\"capgraft.py\", \"verify\")],","    \"rollback\": [(\"capgraft.py\", \"rollback\")],","    \"runs\": [","        (\"capgraft.py\", \"_run_verification\"),","        (\"capgraft.py\", \"_execute_case\"),","    ],","    \"journal\": [(\"capgraft.py\", \"append_event\")],","    \"registry\": [","        (\"capgraft.py\", \"_atomic_write_json\"),","        (\"capgraft.py\", \"init_root\"),","        (\"capgraft.py\", \"load_registry\"),","    ],","}","","# 项目总览展示的全部文件。","# ponytail: 不含 capgraft-flow.html 自身——注入内容会随每次重建递归膨胀。","OVERVIEW_FILES = [","    \"capgraft.py\",","    \"test_capgraft.py\",","    \"examples/word_count/capability.json\",","    \"examples/word_count/adapter.py\",","    \"examples/word_count/trusted.json\",","    \"build_code_view.py\",","]","","","def _require(condition: bool, message: str) -> None:","    \"\"\"在信任边界拒绝不符合约定的输入，直接向用户报告。\"\"\"","    if not condition:","        raise SystemExit(f\"error: {message}\")","","","def parse_symbols(lines: list[str]) -> dict[str, list[int]]:","    \"\"\"切出顶层 def/class 的行号区间，供页面按函数展示与跳转。\"\"\"","    starts = [","        (index, match.group(1))","        for index, line in enumerate(lines)","        if (match := SYMBOL_PATTERN.match(line))","    ]","    symbols: dict[str, list[int]] = {}","    for position, (index, name) in enumerate(starts):","        end = starts[position + 1][0] if position + 1 < len(starts) else len(lines)","        symbols[name] = [index + 1, end]","    return symbols","","","def load_file(relative: str) -> dict:","    \"\"\"读取一个项目文件；Python 文件附带函数行号表，其余只有全文。\"\"\"","    path = PROJECT_DIR / relative","    _require(path.is_file(), f\"缺少源文件: {relative}\")","    lines = path.read_text(encoding=\"utf-8\").splitlines()","    return {","        \"lines\": lines,","        \"symbols\": parse_symbols(lines) if path.suffix == \".py\" else {},","    }","","","def build_payload(files: dict[str, dict]) -> dict:","    \"\"\"校验节点映射后生成注入用 JSON：文件全文 + 节点片段 + 总览清单。\"\"\"","    for node_id, slices in NODE_SOURCES.items():","        for relative, symbol in slices:","            _require(relative in files, f\"{node_id} 引用了未加载文件: {relative}\")","            if symbol is not None:","                _require(","                    symbol in files[relative][\"symbols\"],","                    f\"{node_id} 引用的函数不存在: {relative}:{symbol}\",","                )","    for relative in OVERVIEW_FILES:","        _require(relative in files, f\"总览引用了未加载文件: {relative}\")","    return {","        \"generated_at\": datetime.now(timezone.utc).isoformat(timespec=\"seconds\"),","        \"files\": files,","        \"nodes\": {","            node_id: [","                {\"file\": relative, \"symbol\": symbol} for relative, symbol in slices","            ]","            for node_id, slices in NODE_SOURCES.items()","        },","        \"overview\": OVERVIEW_FILES,","    }","","","def inject(html: str, payload: dict) -> str:","    \"\"\"把 JSON 写入占位块；转义 <\/ 防止提前闭合 script 标签。\"\"\"","    _require(len(PLACEHOLDER.findall(html)) == 1, \"HTML 必须恰好包含一个 code-data 占位块\")","    encoded = json.dumps(payload, ensure_ascii=False, separators=(\",\", \":\"))","    encoded = encoded.replace(\"<\/\", \"<\\\\/\")","    return PLACEHOLDER.sub(lambda m: m.group(1) + encoded + m.group(2), html, count=1)","","","def main() -> int:","    \"\"\"读取源码、校验映射、注入 HTML，并打印一行摘要。\"\"\"","    html = HTML_PATH.read_text(encoding=\"utf-8\")","    page_nodes = set(NODE_ID_PATTERN.findall(html))","    _require(page_nodes == set(NODE_SOURCES), \"节点映射与流程页节点不一致\")","    relatives = sorted(","        {relative for slices in NODE_SOURCES.values() for relative, _ in slices}","        | set(OVERVIEW_FILES)","    )","    files = {relative: load_file(relative) for relative in relatives}","    payload = build_payload(files)","    updated = inject(html, payload)","    HTML_PATH.write_text(updated, encoding=\"utf-8\")","    total_lines = sum(len(entry[\"lines\"]) for entry in files.values())","    print(","        f\"已注入 {len(files)} 个文件 / {total_lines} 行 → {HTML_PATH.name}\"","        f\"（{len(updated.encode('utf-8')) // 1024} KB）\"","    )","    return 0","","","if __name__ == \"__main__\":","    sys.exit(main())"],"symbols":{"_require":[84,89],"parse_symbols":[90,103],"load_file":[104,114],"build_payload":[115,139],"inject":[140,147],"main":[148,170]}},"capgraft.py":{"lines":["#!/usr/bin/env python3","\"\"\"CapGraft：用标准库实现的能力发布、质量证据、调用与回滚 CLI。\"\"\"","","import argparse","import copy","import hashlib","import importlib.util","import io","import json","import math","import os","import re","import shutil","import subprocess","import sys","import tempfile","import time","import uuid","from contextlib import redirect_stdout","from datetime import datetime, timezone","from pathlib import Path","","","SCHEMA_VERSION = 2","GATE_POLICY_VERSION = 1","WORKER_TIMEOUT_SECONDS = 5","ID_PATTERN = re.compile(r\"[a-z][a-z0-9]*(?:\\.[a-z][a-z0-9_]*)*\")","VERSION_PATTERN = re.compile(r\"[A-Za-z0-9][A-Za-z0-9._-]{0,63}\")","TRACE_ID_PATTERN = re.compile(r\"[A-Za-z0-9][A-Za-z0-9._-]{0,127}\")","JSON_TYPES = {","    \"str\": str,","    \"int\": int,","    \"number\": (int, float),","    \"bool\": bool,","    \"dict\": dict,","    \"list\": list,","}","","","class CapgraftError(Exception):","    \"\"\"表示可向 CLI 用户直接报告的预期错误。\"\"\"","","","def _require(condition: bool, message: str) -> None:","    \"\"\"在信任边界拒绝不符合约定的数据。\"\"\"","    if not condition:","        raise CapgraftError(message)","","","def _utc_now() -> str:","    \"\"\"生成统一的 UTC 时间戳。\"\"\"","    return datetime.now(timezone.utc).isoformat()","","","def _validate_schema_fields(schema: object, label: str) -> None:","    \"\"\"校验简单的 JSON 对象字段类型声明。\"\"\"","    _require(isinstance(schema, dict), f\"{label} 必须是对象\")","    for field, type_name in schema.items():","        _require(isinstance(field, str) and bool(field), f\"{label} 含无效字段名\")","        _require(type_name in JSON_TYPES, f\"{label}.{field} 使用了未知类型 {type_name}\")","","","def _validate_payload(payload: object, schema: dict, label: str) -> None:","    \"\"\"确保输入输出与公开能力契约完全一致。\"\"\"","    _require(isinstance(payload, dict), f\"{label} 必须是 JSON 对象\")","    missing = sorted(set(schema) - set(payload))","    extra = sorted(set(payload) - set(schema))","    _require(not missing, f\"{label} 缺少字段: {', '.join(missing)}\")","    _require(not extra, f\"{label} 含未声明字段: {', '.join(extra)}\")","    for field, type_name in schema.items():","        value = payload[field]","        if type_name == \"number\":","            valid = type(value) in (int, float) and math.isfinite(value)","        elif type_name == \"int\":","            valid = type(value) is int","        else:","            valid = isinstance(value, JSON_TYPES[type_name])","        _require(valid, f\"{label}.{field} 应为 {type_name}\")","","","def _validate_case_metadata(case: object, label: str) -> None:","    \"\"\"校验用例名称、类型、来源及错误/期望结构。\"\"\"","    _require(isinstance(case, dict), f\"{label} 必须是对象\")","    _require(isinstance(case.get(\"name\"), str) and case[\"name\"], f\"{label} 缺少名称\")","    kind = case.get(\"kind\")","    _require(kind in {\"normal\", \"error\", \"counterexample\"}, f\"{label} 类型无效\")","    _require(case.get(\"origin\") in {\"human\", \"agent\"}, f\"{label} 必须标记 human/agent 来源\")","    if kind == \"error\":","        _require(isinstance(case.get(\"error\"), str) and case[\"error\"], f\"{label} 缺少异常名\")","        _require(\"expect\" not in case, f\"{label} 不能同时声明 error 和 expect\")","    else:","        _require(\"error\" not in case, f\"{label} 不应声明 error\")","        _require(\"expect\" in case, f\"{label} 缺少 expect\")","","","def _validate_case(case: object, spec: dict, label: str) -> None:","    \"\"\"按能力契约校验一个正常、错误或反例测试用例。\"\"\"","    _validate_case_metadata(case, label)","    _validate_payload(case.get(\"input\"), spec[\"input\"], f\"{label}.input\")","    if case[\"kind\"] != \"error\":","        _validate_payload(case.get(\"expect\"), spec[\"output\"], f\"{label}.expect\")","","","def _require_all_kinds(cases: list, label: str) -> None:","    \"\"\"确保测试集合同时覆盖正常、错误和反例。\"\"\"","    kinds = {case[\"kind\"] for case in cases}","    _require({\"normal\", \"error\", \"counterexample\"} <= kinds, f\"{label} 必须包含正常、错误和反例测试\")","","","def validate_spec(spec: object) -> None:","    \"\"\"校验能力提案格式，候选测试只作为自证材料。\"\"\"","    _require(isinstance(spec, dict), \"capability.json 顶层必须是对象\")","    required = {","        \"schema_version\", \"id\", \"version\", \"source\", \"friction_id\", \"friction\",","        \"input\", \"output\", \"tests\",","    }","    _require(set(spec) == required, f\"能力字段必须严格为: {', '.join(sorted(required))}\")","    _require(spec[\"schema_version\"] == SCHEMA_VERSION, \"不支持的 schema_version\")","    _require(isinstance(spec[\"id\"], str) and ID_PATTERN.fullmatch(spec[\"id\"]), \"能力 id 无效\")","    _require(","        isinstance(spec[\"version\"], str) and VERSION_PATTERN.fullmatch(spec[\"version\"]),","        \"能力 version 无效\",","    )","    source = spec[\"source\"]","    _require(isinstance(source, dict) and set(source) == {\"name\", \"revision\", \"license\"}, \"source 格式无效\")","    for key in (\"name\", \"revision\", \"license\"):","        _require(isinstance(source[key], str) and source[key], f\"source.{key} 不能为空\")","    _require(","        isinstance(spec[\"friction_id\"], str) and TRACE_ID_PATTERN.fullmatch(spec[\"friction_id\"]),","        \"friction_id 无效\",","    )","    _require(isinstance(spec[\"friction\"], str) and spec[\"friction\"], \"必须记录真实能力缺口\")","    _validate_schema_fields(spec[\"input\"], \"input\")","    _validate_schema_fields(spec[\"output\"], \"output\")","    tests = spec[\"tests\"]","    _require(isinstance(tests, list) and tests, \"tests 必须是非空数组\")","    for index, case in enumerate(tests):","        _validate_case(case, spec, f\"tests[{index}]\")","    _require_all_kinds(tests, \"tests\")","","","def load_spec(directory: Path) -> dict:","    \"\"\"读取并验证能力契约及固定入口 adapter.py。\"\"\"","    try:","        spec = json.loads((directory / \"capability.json\").read_text(encoding=\"utf-8\"))","    except (OSError, json.JSONDecodeError) as exc:","        raise CapgraftError(f\"无法读取 {directory / 'capability.json'}: {exc}\") from exc","    validate_spec(spec)","    _require((directory / \"adapter.py\").is_file(), f\"{directory} 缺少 adapter.py\")","    return spec","","","def _release_path(root: Path, capability_id: str, version: str) -> Path:","    \"\"\"构造受命名约束的发布路径，阻止路径穿越。\"\"\"","    _require(ID_PATTERN.fullmatch(capability_id), \"能力 id 无效\")","    _require(VERSION_PATTERN.fullmatch(version), \"能力 version 无效\")","    return root / \"releases\" / capability_id / version","","","def _release_digest(directory: Path) -> str:","    \"\"\"对契约与适配器字节计算摘要，证明被测对象身份。\"\"\"","    digest = hashlib.sha256()","    for name in (\"capability.json\", \"adapter.py\"):","        digest.update(name.encode(\"utf-8\"))","        digest.update(b\"\\0\")","        digest.update((directory / name).read_bytes())","        digest.update(b\"\\0\")","    return digest.hexdigest()","","","def _check_known_good_digest(registry: dict, capability_id: str, version: str, digest: str) -> None:","    \"\"\"拒绝执行或回退到已偏离验证证据的 known_good 字节。\"\"\"","    good = registry.get(\"known_good\", {}).get(capability_id)","    if good and good[\"version\"] == version:","        _require(digest == good[\"release_sha256\"], \"发布内容已偏离 known_good 证据\")","","","def _atomic_write_json(path: Path, value: object) -> None:","    \"\"\"通过同目录临时文件和原子替换避免半截 JSON。\"\"\"","    path.parent.mkdir(parents=True, exist_ok=True)","    temporary_name = None","    try:","        with tempfile.NamedTemporaryFile(","            mode=\"w\", encoding=\"utf-8\", dir=path.parent, delete=False","        ) as handle:","            temporary_name = handle.name","            json.dump(value, handle, ensure_ascii=False, indent=2, allow_nan=False)","            handle.write(\"\\n\")","            handle.flush()","            os.fsync(handle.fileno())","        os.replace(temporary_name, path)","    finally:","        if temporary_name and Path(temporary_name).exists():","            Path(temporary_name).unlink()","","","def init_root(root: Path) -> None:","    \"\"\"初始化发布库、受信任门禁、证据目录和审计日志。\"\"\"","    (root / \"releases\").mkdir(parents=True, exist_ok=True)","    (root / \"trusted\").mkdir(parents=True, exist_ok=True)","    (root / \"runs\").mkdir(parents=True, exist_ok=True)","    registry_path = root / \"registry.json\"","    if not registry_path.exists():","        _atomic_write_json(","            registry_path,","            {\"schema_version\": SCHEMA_VERSION, \"revision\": 0, \"active\": {}, \"known_good\": {}},","        )","    (root / \"journal.jsonl\").touch(exist_ok=True)","","","def load_registry(root: Path) -> dict:","    \"\"\"读取当前激活版本及带证据引用的 known_good。\"\"\"","    try:","        registry = json.loads((root / \"registry.json\").read_text(encoding=\"utf-8\"))","    except (OSError, json.JSONDecodeError) as exc:","        raise CapgraftError(f\"无法读取注册表，请先运行 init: {exc}\") from exc","    _require(isinstance(registry, dict), \"注册表必须是对象\")","    _require(registry.get(\"schema_version\") == SCHEMA_VERSION, \"注册表版本不受支持\")","    _require(type(registry.get(\"revision\")) is int and registry[\"revision\"] >= 0, \"注册表 revision 无效\")","    _require(isinstance(registry.get(\"active\"), dict), \"注册表 active 无效\")","    _require(isinstance(registry.get(\"known_good\"), dict), \"注册表 known_good 无效\")","    return registry","","","def append_event(root: Path, kind: str, **fields: object) -> None:","    \"\"\"追加审计事件并落盘，历史事件从不更新或删除。\"\"\"","    event = {","        \"ts\": _utc_now(),","        \"schema_version\": SCHEMA_VERSION,","        \"kind\": kind,","        **fields,","    }","    with (root / \"journal.jsonl\").open(\"a\", encoding=\"utf-8\") as handle:","        handle.write(json.dumps(event, ensure_ascii=False, allow_nan=False) + \"\\n\")","        handle.flush()","        os.fsync(handle.fileno())","","","def install_trusted_gate(root: Path, capability_id: str, gate_file: Path, approver: str) -> Path:","    \"\"\"由控制面显式安装受信任门禁，并记录审批者与文件摘要。\"\"\"","    init_root(root)","    _require(ID_PATTERN.fullmatch(capability_id), \"能力 id 无效\")","    _require(isinstance(approver, str) and approver.strip(), \"必须提供审批者\")","    try:","        document = json.loads(gate_file.read_text(encoding=\"utf-8\"))","    except (OSError, json.JSONDecodeError) as exc:","        raise CapgraftError(f\"无法读取受信任门禁: {exc}\") from exc","    _require(isinstance(document, dict), \"受信任门禁必须是对象\")","    _require(set(document) == {\"schema_version\", \"capability_id\", \"cases\"}, \"受信任门禁字段无效\")","    _require(document[\"schema_version\"] == SCHEMA_VERSION, \"受信任门禁版本不受支持\")","    _require(document[\"capability_id\"] == capability_id, \"受信任门禁能力 id 不一致\")","    cases = document[\"cases\"]","    _require(isinstance(cases, list) and cases, \"受信任用例必须是非空数组\")","    for index, case in enumerate(cases):","        _validate_case_metadata(case, f\"trusted[{index}]\")","    _require_all_kinds(cases, \"受信任门禁\")","    gate = {","        \"schema_version\": SCHEMA_VERSION,","        \"capability_id\": capability_id,","        \"approved_by\": approver.strip(),","        \"approved_at\": _utc_now(),","        \"cases\": cases,","    }","    path = root / \"trusted\" / f\"{capability_id}.json\"","    _atomic_write_json(path, gate)","    gate_sha256 = hashlib.sha256(","        json.dumps(cases, ensure_ascii=False, sort_keys=True).encode(\"utf-8\")","    ).hexdigest()","    append_event(","        root,","        \"trusted_gate_installed\",","        capability_id=capability_id,","        approved_by=gate[\"approved_by\"],","        gate_sha256=gate_sha256,","    )","    return path","","","def _load_trusted_gate(root: Path, capability_id: str, spec: dict) -> dict:","    \"\"\"加载控制面门禁，并按当前公开契约重新校验。\"\"\"","    path = root / \"trusted\" / f\"{capability_id}.json\"","    try:","        gate = json.loads(path.read_text(encoding=\"utf-8\"))","    except (OSError, json.JSONDecodeError) as exc:","        raise CapgraftError(f\"缺少受信任门禁，请先运行 trust: {exc}\") from exc","    _require(isinstance(gate, dict), \"受信任门禁必须是对象\")","    _require(gate.get(\"schema_version\") == SCHEMA_VERSION, \"受信任门禁版本不受支持\")","    _require(gate.get(\"capability_id\") == capability_id, \"受信任门禁能力 id 不一致\")","    for key in (\"approved_by\", \"approved_at\"):","        _require(isinstance(gate.get(key), str) and gate[key], f\"受信任门禁缺少 {key}\")","    cases = gate.get(\"cases\")","    _require(isinstance(cases, list) and cases, \"受信任用例必须是非空数组\")","    for index, case in enumerate(cases):","        _validate_case(case, spec, f\"trusted[{index}]\")","    _require_all_kinds(cases, \"受信任门禁\")","    return gate","","","def _worker_entry(release: Path) -> None:","    \"\"\"在子进程中加载适配器，并通过 stdout 返回唯一 JSON 信封。\"\"\"","    try:","        payload = json.load(sys.stdin)","        adapter_path = release / \"adapter.py\"","        module_spec = importlib.util.spec_from_file_location(\"capgraft_adapter\", adapter_path)","        if module_spec is None or module_spec.loader is None:","            raise ImportError(f\"无法加载 {adapter_path}\")","        module = importlib.util.module_from_spec(module_spec)","        # 适配器的 print 不得污染机器可读 stdout 协议。","        with redirect_stdout(io.StringIO()):","            module_spec.loader.exec_module(module)","            value = module.run(payload)","        encoded = json.dumps({\"ok\": True, \"value\": value}, ensure_ascii=False, allow_nan=False)","    except Exception as exc:","        encoded = json.dumps(","            {\"ok\": False, \"error_type\": type(exc).__name__, \"message\": str(exc)},","            ensure_ascii=False,","        )","    sys.stdout.write(encoded)","","","def _call_worker(release: Path, payload: dict) -> dict:","    \"\"\"调用故障隔离 Worker；该进程边界不是安全沙箱。\"\"\"","    command = [sys.executable, str(Path(__file__).resolve()), \"_worker\", str(release)]","    try:","        completed = subprocess.run(","            command,","            input=json.dumps(payload, ensure_ascii=False, allow_nan=False),","            text=True,","            capture_output=True,","            timeout=WORKER_TIMEOUT_SECONDS,","            check=False,","        )","    except subprocess.TimeoutExpired as exc:","        raise CapgraftError(f\"Worker 超过 {WORKER_TIMEOUT_SECONDS} 秒\") from exc","    if completed.returncode != 0:","        detail = completed.stderr.strip() or completed.stdout.strip() or \"无错误输出\"","        raise CapgraftError(f\"Worker 异常退出: {detail}\")","    try:","        envelope = json.loads(completed.stdout)","    except json.JSONDecodeError as exc:","        raise CapgraftError(\"Worker 未返回合法 JSON 信封\") from exc","    _require(isinstance(envelope, dict) and type(envelope.get(\"ok\")) is bool, \"Worker 信封无效\")","    return envelope","","","def _run_case(release: Path, spec: dict, case: dict, label: str) -> None:","    \"\"\"执行一个行为用例并检查异常、输出类型和精确结果。\"\"\"","    envelope = _call_worker(release, case[\"input\"])","    expected_error = case.get(\"error\")","    if not envelope[\"ok\"]:","        actual = f\"{envelope.get('error_type')}: {envelope.get('message')}\"","        if expected_error:","            _require(envelope.get(\"error_type\") == expected_error, f\"{label} 异常不符: {actual}\")","            return","        raise CapgraftError(f\"{label} 执行失败: {actual}\")","    _require(not expected_error, f\"{label} 应抛出 {expected_error}\")","    value = envelope.get(\"value\")","    _validate_payload(value, spec[\"output\"], f\"{label}.output\")","    _require(value == case[\"expect\"], f\"{label} 期望 {case['expect']}，实际 {value}\")","","","def _execute_case(release: Path, spec: dict, case: dict, layer: str) -> dict:","    \"\"\"执行一次用例并生成证据；失败不重试、不覆盖。\"\"\"","    started = time.perf_counter()","    error = None","    try:","        _run_case(release, spec, case, f\"{layer}:{case['name']}\")","    except CapgraftError as exc:","        error = str(exc)","    return {","        \"case_id\": case[\"name\"],","        \"origin\": case[\"origin\"],","        \"layer\": layer,","        \"result\": \"failed\" if error else \"pass\",","        \"duration_ms\": max(0, int((time.perf_counter() - started) * 1000)),","        \"attempt\": 1,","        \"error\": error,","    }","","","def _run_verification(","    root: Path, directory: Path, spec: dict, phase: str, include_trusted: bool",") -> dict:","    \"\"\"生成不可变 VerificationRun，并让审计事件引用它。\"\"\"","    trusted = _load_trusted_gate(root, spec[\"id\"], spec) if include_trusted else None","    run_id = f\"run_{uuid.uuid4().hex}\"","    started_at = _utc_now()","    results = [","        _execute_case(directory, spec, case, \"candidate\")","        for case in spec[\"tests\"]","    ]","    if trusted:","        results.extend(","            _execute_case(directory, spec, case, \"trusted\")","            for case in trusted[\"cases\"]","        )","    result = \"pass\" if all(case[\"result\"] == \"pass\" for case in results) else \"failed\"","    if phase == \"publish\":","        reproduce = [sys.executable, str(Path(__file__).resolve()), \"--root\", str(root.resolve()), \"publish\", str(directory.resolve())]","    else:","        reproduce = [sys.executable, str(Path(__file__).resolve()), \"--root\", str(root.resolve()), \"verify\", spec[\"id\"], spec[\"version\"]]","    report = {","        \"schema_version\": 1,","        \"run_id\": run_id,","        \"capability_id\": spec[\"id\"],","        \"capability_version\": spec[\"version\"],","        \"friction_id\": spec[\"friction_id\"],","        \"source\": spec[\"source\"],","        \"release_sha256\": _release_digest(directory),","        \"phase\": phase,","        \"policy_version\": GATE_POLICY_VERSION,","        \"python\": sys.version.split()[0],","        \"platform\": sys.platform,","        \"started_at\": started_at,","        \"finished_at\": _utc_now(),","        \"result\": result,","        \"tests\": results,","        \"trusted_gate\": {","            \"approved_by\": trusted[\"approved_by\"],","            \"approved_at\": trusted[\"approved_at\"],","        } if trusted else None,","        \"reproduce\": reproduce,","    }","    run_path = root / \"runs\" / f\"{run_id}.json\"","    _atomic_write_json(run_path, report)","    append_event(","        root,","        \"verification_completed\",","        run_id=run_id,","        capability_id=spec[\"id\"],","        capability_version=spec[\"version\"],","        phase=phase,","        result=result,","        release_sha256=report[\"release_sha256\"],","        run_path=str(run_path),","    )","    return report","","","def _check_active_releases(root: Path, active: dict) -> list[dict]:","    \"\"\"重跑所有现役能力的候选测试和受信任门禁。\"\"\"","    registry = load_registry(root)","    reports = []","    for capability_id, version in active.items():","        release = _release_path(root, capability_id, version)","        spec = load_spec(release)","        _require(spec[\"id\"] == capability_id and spec[\"version\"] == version, \"发布路径与契约不一致\")","        _check_known_good_digest(registry, capability_id, version, _release_digest(release))","        reports.append(_run_verification(root, release, spec, \"activation\", True))","    return reports","","","def publish(root: Path, candidate: Path) -> Path:","    \"\"\"验证候选自证材料并发布为不可覆盖的版本目录。\"\"\"","    init_root(root)","    spec = load_spec(candidate)","    report = _run_verification(root, candidate, spec, \"publish\", False)","    _require(report[\"result\"] == \"pass\", f\"候选测试失败，证据: {report['run_id']}\")","    release = _release_path(root, spec[\"id\"], spec[\"version\"])","    _require(not release.exists(), f\"版本已存在，禁止覆盖: {spec['id']}@{spec['version']}\")","    release.parent.mkdir(parents=True, exist_ok=True)","    try:","        release.mkdir()","        # MVP 只接收单文件适配器，避免隐式复制无关文件。","        shutil.copy2(candidate / \"capability.json\", release / \"capability.json\")","        shutil.copy2(candidate / \"adapter.py\", release / \"adapter.py\")","    except Exception:","        if release.exists():","            shutil.rmtree(release)","        raise","    append_event(","        root,","        \"capability_published\",","        capability_id=spec[\"id\"],","        capability_version=spec[\"version\"],","        friction_id=spec[\"friction_id\"],","        source=spec[\"source\"],","        release_sha256=report[\"release_sha256\"],","        verification_run_id=report[\"run_id\"],","    )","    return release","","","def activate(root: Path, capability_id: str, version: str) -> dict:","    \"\"\"原子激活候选版本，受信任门禁失败时恢复完整旧注册表。\"\"\"","    registry = load_registry(root)","    release = _release_path(root, capability_id, version)","    spec = load_spec(release)","    _require(spec[\"id\"] == capability_id and spec[\"version\"] == version, \"发布路径与契约不一致\")","    _load_trusted_gate(root, capability_id, spec)","    previous = copy.deepcopy(registry)","    candidate = copy.deepcopy(registry)","    candidate[\"active\"][capability_id] = version","    candidate[\"revision\"] += 1","    # ponytail: 单写者 MVP，并发激活需要引入文件锁。","    _atomic_write_json(root / \"registry.json\", candidate)","    append_event(","        root, \"capability_activation_started\", capability_id=capability_id, capability_version=version","    )","    reports = []","    try:","        reports = _check_active_releases(root, candidate[\"active\"])","        failed = [report for report in reports if report[\"result\"] != \"pass\"]","        if failed:","            raise CapgraftError(\"受信任门禁失败: \" + \", \".join(report[\"run_id\"] for report in failed))","    except CapgraftError as exc:","        current = load_registry(root)","        restored = {","            \"schema_version\": SCHEMA_VERSION,","            \"revision\": current[\"revision\"] + 1,","            \"active\": previous[\"active\"],","            \"known_good\": previous[\"known_good\"],","        }","        _atomic_write_json(root / \"registry.json\", restored)","        previous_good = previous[\"known_good\"].get(capability_id)","        append_event(","            root,","            \"capability_rolled_back\",","            capability_id=capability_id,","            from_version=version,","            to_version=previous[\"active\"].get(capability_id),","            to_verification_run_id=previous_good[\"verification_run_id\"] if previous_good else None,","            failed_run_ids=[report[\"run_id\"] for report in reports if report[\"result\"] != \"pass\"],","            trigger=\"activation_healthcheck\",","            reason=str(exc),","        )","        raise CapgraftError(f\"激活失败，已自动回退: {exc}\") from exc","    confirmed = load_registry(root)","    candidate_report = next(report for report in reports if report[\"capability_id\"] == capability_id)","    confirmed[\"known_good\"][capability_id] = {","        \"version\": version,","        \"verification_run_id\": candidate_report[\"run_id\"],","        \"release_sha256\": candidate_report[\"release_sha256\"],","    }","    confirmed[\"revision\"] += 1","    _atomic_write_json(root / \"registry.json\", confirmed)","    append_event(","        root,","        \"capability_activated\",","        capability_id=capability_id,","        capability_version=version,","        friction_id=spec[\"friction_id\"],","        release_sha256=candidate_report[\"release_sha256\"],","        verification_run_ids=[report[\"run_id\"] for report in reports],","    )","    return confirmed","","","def verify(root: Path, capability_id: str, version: str) -> dict:","    \"\"\"复现发布版本的候选测试与受信任门禁，生成新证据。\"\"\"","    release = _release_path(root, capability_id, version)","    spec = load_spec(release)","    _require(spec[\"id\"] == capability_id and spec[\"version\"] == version, \"发布路径与契约不一致\")","    _check_known_good_digest(load_registry(root), capability_id, version, _release_digest(release))","    report = _run_verification(root, release, spec, \"verify\", True)","    _require(report[\"result\"] == \"pass\", f\"验证失败，证据: {report['run_id']}\")","    return report","","","def invoke(root: Path, capability_id: str, payload: dict) -> dict:","    \"\"\"按注册表选择不可变版本，校验输入输出并记录调用结果。\"\"\"","    registry = load_registry(root)","    _require(capability_id in registry[\"active\"], f\"能力未激活: {capability_id}\")","    version = registry[\"active\"][capability_id]","    release = _release_path(root, capability_id, version)","    spec = load_spec(release)","    digest = _release_digest(release)","    _check_known_good_digest(registry, capability_id, version, digest)","    _validate_payload(payload, spec[\"input\"], \"input\")","    try:","        envelope = _call_worker(release, payload)","        if not envelope[\"ok\"]:","            raise CapgraftError(f\"{envelope.get('error_type')}: {envelope.get('message')}\")","        value = envelope.get(\"value\")","        _validate_payload(value, spec[\"output\"], \"output\")","    except CapgraftError as exc:","        append_event(","            root,","            \"capability_invoked\",","            capability_id=capability_id,","            capability_version=version,","            release_sha256=digest,","            status=\"error\",","            message=str(exc),","        )","        raise","    append_event(","        root,","        \"capability_invoked\",","        capability_id=capability_id,","        capability_version=version,","        release_sha256=digest,","        status=\"ok\",","    )","    return value","","","def rollback(root: Path, capability_id: str) -> dict:","    \"\"\"手动切回该能力带证据引用的最近 known_good。\"\"\"","    registry = load_registry(root)","    _require(capability_id in registry[\"active\"], f\"能力未激活: {capability_id}\")","    _require(capability_id in registry[\"known_good\"], f\"能力没有 known_good: {capability_id}\")","    current = registry[\"active\"][capability_id]","    target = registry[\"known_good nds.add_parser(\"verify\", help=\"复现验证并生成新证据\")","    verify_parser.add_argument(\"capability_id\")","    verify_parser.add_argument(\"version\")","    invoke_parser = commands.add_parser(\"invoke\", help=\"调用现役能力\")","    invoke_parser.add_argument(\"capability_id\")","    invoke_parser.add_argument(\"--input\", dest=\"input_json\", required=True, help=\"JSON 输入对象\")","    rollback_parser = commands.add_parser(\"rollback\", help=\"回退到最近 known_good\")","    rollback_parser.add_argument(\"capability_id\")","    commands.add_parser(\"status\", help=\"显示当前注册表\")","    worker_parser = commands.add_parser(\"_worker\", help=argparse.SUPPRESS)","    worker_parser.add_argument(\"release\", type=Path)","    return parser","","","def main(argv: list[str] | None = None) -> int:","    \"\"\"分发 CLI 命令，并把预期错误转换为非零退出码。\"\"\"","    args = build_parser().parse_args(argv)","    if args.command == \"_worker\":","        _worker_entry(args.release)","        return 0","    try:","        if args.command == \"init\":","            init_root(args.root)","            result = {\"root\": str(args.root)}","        elif args.command == \"trust\":","            path = install_trusted_gate(args.root, args.capability_id, args.gate_file, args.approver)","            result = {\"trusted_gate\": str(path), \"approved_by\": args.approver}","        elif args.command == \"publish\":","            release = publish(args.root, args.candidate)","            result = {\"release\": str(release)}","        elif args.command == \"activate\":","            result = activate(args.root, args.capability_id, args.version)","        elif args.command == \"verify\":","            result = verify(args.root, args.capability_id, args.version)","        elif args.command == \"invoke\":","            try:","                payload = json.loads(args.input_json)","            except json.JSONDecodeError as exc:","                raise CapgraftError(f\"--input 不是合法 JSON: {exc}\") from exc","            result = invoke(ar til","import tempfile","import unittest","from pathlib import Path","","import capgraft","","","PROJECT_DIR = Path(__file__).resolve().parent","EXAMPLE_DIR = PROJECT_DIR / \"examples\" / \"word_count\"","TRUSTED_FILE = EXAMPLE_DIR / \"trusted.json\"","","","class CapgraftEndToEndTest(unittest.TestCase):","    \"\"\"覆盖质量证据、独立门禁、调用和自动回滚。\"\"\"","","    def setUp(self) -> None:","        \"\"\"每个用例使用独立状态目录，避免审计事件互相污染。\"\"\"","        self.temporary = tempfile.TemporaryDirectory()","        self.base = Path(self.temporary.name)","        self.root = self.base / \".capgraft\"","        capgraft.init_root(self.root)","","    def tearDown(self) -> None:","        \"\"\"清理测试自己创建的临时文件。\"\"\"","        self.temporary.cleanup()","","    def _install_trust(self) -> None:","        \"\"\"模拟控制面显式审批受信任门禁。\"\"\"","        capgraft.install_trusted_gate(","            self.root, \"text.word_count\", TRUSTED_FILE, \"test-reviewer\"","        )","","    def _activate_v1(self) -> None:","        \"\"\"建立文本统计能力的 known_good v1。\"\"\"","        self._install_trust()","        capgraft.publish(self.root, EXAMPLE_DIR)","        capgraft.activate(self.root, \"text.word_count\", \"v1\")","","    def _make_self_certified_candidate(self, version: str) -> Path:","        \"\"\"生成候选自证通过但受信任门禁必然失败的版本。\"\"\"","        candidate = self.base / f\"candidate_{version}\"","        shutil.copytree(EXAMPLE_DIR, candidate)","        spec_path = candidate / \"capability.json\"","        spec = json.loads(spec_path.read_text(encoding=\"utf-8\"))","        spec[\"version\"] = version","        for case in spec[\"tests\"]:","            if \"expect\" in case:","                case[\"expect\"][\"characters\"] += 1","        spec_path.write_text(json.dumps(spec, ensure_ascii=False, indent=2) + \"\\n\", encoding=\"utf-8\")","        adapter_path = candidate / \"adapter.py\"","        adapter = adapter_path.read_text(encoding=\"utf-8\")","        adapter = adapter.replace('\"characters\": len(text)', '\"characters\": len(text) + 1')","        adapter_path.write_text(adapter, encoding=\"utf-8\")","        return candidate","","    def _events(self) -> list[dict]:","        \"\"\"读取真实 JSONL 审计日志。\"\"\"","        lines = (self.root / \"journal.jsonl\").read_text(encoding=\"utf-8\").splitlines()","        return [json.loads(line) for line in lines]","","    def _run(self, run_id: str) -> dict:","        \"\"\"读取不可变验证证据。\"\"\"","        return json.loads((self.root / \"runs\" / f\"{run_id}.json\").read_text(encoding=\"utf-8\"))","","    def test_known_good_links_to_complete_evidence(self) -> None:","        \"\"\"known_good 必须能追溯到代码摘要、摩擦 ID 和双层测试。\"\"\"","        self._activate_v1()","        result = capgraft.invoke(self.root, \"text.word_count\", {\"text\": \"hello world\"})","        self.assertEqual(result, {\"words\": 2, \"characters\": 11})","        registry = capgraft.load_registry(self.root)","        good = registry[\"known_good\"][\"text.word_count\"]","        self.assertEqual(good[\"version\"], \"v1\")","        self.assertEqual(len(good[\"release_sha256\"]), 64)","        report = self._run(good[\"verification_run_id\"])","        self.assertEqual(report[\"result\"], \"pass\")","        self.assertEqual(report[\"friction_id\"], \"FR-0007\")","        self.assertEqual(report[\"release_sha256\"], good[\"release_sha256\"])","        self.assertEqual({case[\"layer\"] for case in report[\"tests\"]}, {\"candidate\", \"trusted\"})","        self.assertTrue(all(case[\"attempt\"] == 1 for case in report[\"tests\"]))","        activated = [e for e in self._events() if e[\"kind\"] == \"capability_activated\"][-1]","        self.assertIn(good[\"verification_run_id\"], activated[\"verification_run_ids\"])","        with self.assertRaises(capgraft.CapgraftError):","            capgraft.invoke(self.root, \"text.word_count\", {\"text\": 123})","        with self.assertRaises(capgraft.CapgraftError):","            capgraft.publish(self.root, EXAMPLE_DIR)","        adapter = self.root / \"releases\" / \"text.word_count\" / \"v1\" / \"adapter.py\"","        adapter.write_text(adapter.read_text(encoding=\"utf-8\") + \"\\n# tampered\\n\", encoding=\"utf-8\")","        with self.assertRaisesRegex(capgraft.CapgraftError, \"偏离 known_good\"):","            capgraft.invoke(self.root, \"text.word_count\", {\"text\": \"hello world\"})","        with self.assertRaisesRegex(capgraft.CapgraftError, \"偏离 known_good\"):","            capgraft.verify(self.root, \"text.word_count\", \"v1\")","","    def test_verify_appends_new_evidence_without_overwrite(self) -> None:","        \"\"\"复现验证必须生成新 run，而不是改写历史结果。\"\"\"","        self._activate_v1()","        first = capgraft.load_registry(self.root)[\"known_good\"][\"text.word_count\"][\"verification_run_id\"]","        report = capgraft.verify(self.root, \"text.word_count\", \"v1\")","        self.assertNotEqual(report[\"run_id\"], first)","        self.assertEqual(report[\"phase\"], \"verify\")","        self.assertEqual(report[\"result\"], \"pass\")","        self.assertTrue((self.root / \"runs\" / f\"{first}.json\").is_file())","        self.assertTrue((self.root / \"runs\" / f\"{report['run_id']}.json\").is_file())","        self.assertIn(\"verify\", report[\"reproduce\"])","","    def test_candidate_self_proof_cannot_bypass_trusted_gate(self) -> None:","        \"\"\"候选修改自身测试仍必须在受信任门禁处失败并回滚。\"\"\"","        self._activate_v1()","        candidate = self._make_self_certified_candidate(\"v2\")","        capgraft.publish(self.root, candidate)","        with self.assertRaisesRegex(capgraft.CapgraftError, \"已自动回退\"):","            capgraft.activate(self.root, \"text.word_count\", \"v2\")","        registry = capgraft.load_registry(self.root)","        good = registry[\"known_good\"][\"text.word_count\"]","        self.assertEqual(registry[\"active\"][\"text.word_count\"], \"v1\")","        self.assertEqual(good[\"version\"], \"v1\")","        self.assertEqual(registry[\"revision\"], 4)","        rollback = [e for e in self._events() if e[\"kind\"] == \"capability_rolled_back\"][-1]","        self.assertEqual(rollback[\"to_verification_run_id\"], good[\"verification_run_id\"])","        self.assertEqual(len(rollback[\"failed_run_ids\"]), 1)","        failed = self._run(rollback[\"failed_run_ids\"][0])","        self.assertEqual(failed[\"result\"], \"failed\")","        self.assertTrue(any(c[\"layer\"] == \"trusted\" and c[\"result\"] == \"failed\" for c in failed[\"tests\"]))","        published = [e for e in self._events() if e[\"kind\"] == \"capability_published\" and e[\"capability_version\"] == \"v2\"][-1]","        self.assertEqual(self._run(published[\"verification_run_id\"])[\"result\"], \"pass\")","        result = capgraft.invoke(self.root, \"text.word_count\", {\"text\": \"still works\"})","        self.assertEqual(result[\"words\"], 2)","","    def test_failed_first_activation_leaves_capability_inactive(self) -> None:","        \"\"\"没有旧版可退时，首个坏版本不得残留为现役能力。\"\"\"","        self._install_trust()","        candidate = self._make_self_certified_candidate(\"v1\")","        capgraft.publish(self.root, candidate)","        with self.assertRaisesRegex(capgraft.CapgraftError, \"已自动回退\"):","            capgraft.activate(self.root, \"text.word_count\", \"v1\")","        registry = capgraft.load_registry(self.root)","        self.assertNotIn(\"text.word_count\", registry[\"active\"])","        self.assertNotIn(\"text.word_count\", registry[\"known_good\"])","        rollback = [e for e in self._events() if e[\"kind\"] == \"capability_rolled_back\"][-1]","        self.assertIsNone(rollback[\"to_version\"])","        self.assertTrue(rollback[\"failed_run_ids\"])","","    def test_activation_requires_trusted_gate(self) -> None:","        \"\"\"只有候选自证时不得激活，也不得产生半截现役状态。\"\"\"","        capgraft.publish(self.root, EXAMPLE_DIR)","        with self.assertRaisesRegex(capgraft.CapgraftError, \"缺少受信任门禁\"):","            capgraft.activate(self.root, \"text.word_count\", \"v1\")","        registry = capgraft.load_registry(self.root)","        self.assertEqual(registry[\"active\"], {})","        self.assertEqual(registry[\"known_good\"], {})","","","if __name__ == \"__main__\":","    unittest.main()"],"symbols":{"CapgraftEndToEndTest":[17,157]}}},"nodes":{"friction":[{"file":"examples/word_count/capability.json","symbol":null},{"file":"capgraft.py","symbol":"validate_spec"}],"candidate":[{"file":"examples/word_count/adapter.py","symbol":null},{"file":"capgraft.py","symbol":"load_spec"}],"publish":[{"file":"capgraft.py","symbol":"publish"},{"file":"capgraft.py","symbol":"_run_verification"}],"trust":[{"file":"examples/word_count/trusted.json","symbol":null},{"file":"capgraft.py","symbol":"install_trusted_gate"},{"file":"capgraft.py","symbol":"_load_trusted_gate"}],"activate":[{"file":"capgraft.py","symbol":"activate"},{"file":"capgraft.py","symbol":"_check_active_releases"}],"good":[{"file":"capgraft.py","symbol":"_check_known_good_digest"},{"file":"capgraft.py","symbol":"_release_digest"},{"file":"capgraft.py","symbol":"load_registry"}],"invoke":[{"file":"capgraft.py","symbol":"invoke"},{"file":"capgraft.py","symbol":"_call_worker"},{"file":"capgraft.py","symbol":"_worker_entry"}],"verify":[{"file":"capgraft.py","symbol":"verify"}],"rollback":[{"file":"capgraft.py","symbol":"rollback"}],"runs":[{"file":"capgraft.py","symbol":"_run_verification"},{"file":"capgraft.py","symbol":"_execute_case"}],"journal":[{"file":"capgraft.py","symbol":"append_event"}],"registry":[{"file":"capgraft.py","symbol":"_atomic_write_json"},{"file":"capgraft.py","symbol":"init_root"},{"file":"capgraft.py","symbol":"load_registry"}]},"overview":["capgraft.py","test_capgraft.py","examples/word_count/capability.json","examples/word_count/adapter.py","examples/word_count/trusted.json","build_code_view.py"]}</script>

  info:"当前激活版本与 known_good 证据引用。通过同目录临时文件 + 原子替换写入，读方永远看到完整 JSON。"},

const links=[
 {a:"friction", b:"candidate",t:"方向"},
 {a:"candidate",b:"publish",  t:"自证通过"},
 {a:"publish",  b:"activate", t:"不可变 release"},
 {a:"trust",    b:"activate", t:"受信任门禁",cls:"warn"},
 {a:"activate", b:"good",     t:"pass"},
 {a:"activate", b:"rollback", t:"fail",cls:"warn"},
 {a:"rollback", b:"good",     t:"恢复旧版",cls:"warn"},
 {a:"good",     b:"invoke",   t:"按版本路由"},
 {a:"publish",  b:"verify",   t:"复现入口"},
 {a:"verify",   b:"runs",     t:"追加 run",cls:"dash"},
 {a:"good",     b:"registry", t:"持久化",cls:"dash",vert:true},
 {a:"invoke",   b:"journal",  t:"留痕",cls:"dash"},
 {a:"rollback", b:"journal",  t:"留痕",cls:"dash"},
];
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
/* 代码快照：未运行 build_code_view.py 时为 null，面板会提示先构建 */
const CODE=JSON.parse($("code-data").textContent);
let mode="info", whole=false, viewFile=null, panelOpen=false;
const el=(tag,cls)=>{const d=document.createElement(tag); if(cls)d.className=cls; return d;};

/* ── 渲染：节点 + 连线 ── */
function render(){
  world.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${scale})`;
  world.querySelectorAll(".node").forEach(el=>el.remove());
  edges.querySelectorAll("path,text").forEach(el=>el.remove());
  for(const n of nodes){
    const el=document.createElement("div");
    el.className="node"+(n.cls?" "+n.cls:"")+(sel===n?" sel":"");
    el.style.left=n.x+"px"; el.style.top=n.y+"px";
    el.innerHTML=`<div class="hd"><span class="dot"></span>${n.name}</div><div class="bd">${n.bd}</div>`;
    el._n=n; world.appendChild(el); n._el=el;
  }
  for(const l of links){
    const a=byId[l.a], b=byId[l.b];
    const ah=a._el.offsetHeight, bh=b._el.offsetHeight;
    const dx=(b.x+W/2)-(a.x+W/2), dy=(b.y+bh/2)-(a.y+ah/2);
    let p1,p2,c1,c2;
    if(!l.vert&&Math.abs(dx)>=Math.abs(dy)){        // 水平为主：侧边中点出入
      p1={x:a.x+(dx>0?W:0), y:a.y+ah/2}; p2={x:b.x+(dx>0?0:W), y:b.y+bh/2};
      const off=Math.max(40,Math.abs(dx)*.4)*(dx>0?1:-1);
      c1={x:p1.x+off,y:p1.y}; c2={x:p2.x-off,y:p2.y};
    }else{                                  // 垂直为主：上下边中点出入
      p1={x:a.x+W/2, y:a.y+(dy>0?ah:0)}; p2={x:b.x+W/2, y:b.y+(dy>0?0:bh)};
      const off=Math.max(40,Math.abs(dy)*.4)*(dy>0?1:-1);
      c1={x:p1.x,y:p1.y+off}; c2={x:p2.x,y:p2.y-off};
    }
    const hot=sel&&(l.a===sel.id||l.b===sel.id);
    const cls=(hot?"hot":l.cls||"");
    const marker=hot?"arw-hot":l.cls==="warn"?"arw-warn":l.cls==="dash"?"arw-dim":"arw";
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",`M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`);
    path.setAttribute("class",cls); path.setAttribute("marker-end",`url(#${marker})`);
    edges.appendChild(path);
    const mid={x:(p1.x+3*c1.x+3*c2.x+p2.x)/8, y:(p1.y+3*c1.y+3*c2.y+p2.y)/8};
    const text=document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("x",mid.x); text.setAttribute("y",mid.y-5);
    text.setAttribute("text-anchor","middle"); if(hot)text.setAttribute("class","hot");
    text.textContent=l.t; edges.appendChild(text);
  }
}

/* ── 详情/代码面板：选择变化时才重建，拖动缩放不重绘 ── */
function fileBlock(file,symbol,id){
  const wrap=el("div"); if(id)wrap.id=id;
  const f=CODE.files[file];
  const [a,b]=symbol?f.symbols[symbol]:[1,f.lines.length];
  const h=el("div","slice"); h.textContent=`${file} · ${symbol||"整文件"} · L${a}–L${b}`;
  const pre=el("pre");
  pre.textContent=f.lines.slice(a-1,b).map((l,i)=>String(a+i).padStart(4," ")+" │ "+l).join("\n");
  wrap.append(h,pre); return wrap;
}
function renderCode(bd){
  if(!CODE){ bd.textContent="尚未注入代码：先运行 python build_code_view.py"; return; }
  const slices=CODE.nodes[sel.id]||[];
  const bar=el("div");
  if(!whole) slices.forEach((s,i)=>{
    if(!s.symbol) return;
    const j=el("span","jump"); j.textContent=s.symbol;
    j.onclick=()=>{ const t=$("slice-"+i); if(t)t.scrollIntoView({block:"start"}); };
    bar.appendChild(j);
  });
  const t=el("span","jump"); t.textContent=whole?"返回片段":"整文件";
  t.onclick=()=>{ whole=!whole; showDetail(); }; bar.appendChild(t);
  bd.appendChild(bar);
  if(whole){ for(const f of [...new Set(slices.map(s=>s.file))]) bd.appendChild(fileBlock(f,null)); }
  else slices.forEach((s,i)=>bd.appendChild(fileBlock(s.file,s.symbol,"slice-"+i)));
}
function showDetail(){
  detail.classList.toggle("open",panelOpen);
  if(!panelOpen) return;
  detail.innerHTML="";
  const hd=el("div","hd"), bd=el("div","bd"), ft=el("div","ft");
  const title=sel?sel.name:(mode==="file"?viewFile:"项目总览 · 全部源码");
  hd.appendChild(Object.assign(el("b"),{textContent:title}));
  if(sel){
    for(const [m,label] of [["info","说明"],["code","代码"]]){
      const tab=el("span","tab"+(mode===m?" on":"")); tab.textContent=label;
      tab.onclick=()=>{ mode=m; whole=false; showDetail(); }; hd.appendChild(tab);
    }
  }else if(mode==="file"){
    const back=el("span","tab"); back.textContent="← 总览";
    back.onclick=()=>{ mode="overview"; showDetail(); }; hd.appendChild(back);
  }
  const x=el("span","x"); x.textContent="✕";
  x.onclick=()=>{ panelOpen=false; showDetail(); }; hd.appendChild(x);
  if(sel&&mode==="code") renderCode(bd);
  else if(sel) bd.textContent=sel.info;
  else if(mode==="file") bd.appendChild(fileBlock(viewFile,null));
  else if(CODE) for(const f of CODE.overview){
    const d=el("span","file"); d.textContent=`${f} · ${CODE.files[f].lines.length} 行`;
    d.onclick=()=>{ viewFile=f; mode="file"; showDetail(); }; bd.appendChild(d);
  }
  else bd.textContent="尚未注入代码：先运行 python build_code_view.py";
  ft.textContent=CODE?`代码快照 ${CODE.generated_at} · 更新: python build_code_view.py`:"未注入代码快照";
  detail.append(hd,bd,ft);
}

/* ── 视图：滚轮以光标为中心缩放，双击空白复位 ── */
function fit(){
  const x0=Math.min(...nodes.map(n=>n.x))-60, y0=Math.min(...nodes.map(n=>n.y))-60;
  const x1=Math.max(...nodes.map(n=>n.x))+W+60, y1=Math.max(...nodes.map(n=>n.y))+120;
  scale=Math.max(.25,Math.min((innerWidth-80)/(x1-x0),(innerHeight-120)/(y1-y0),1.1));
  pan.x=-(x0+x1)/2*scale; pan.y=-(y0+y1)/2*scale; render();
}
viewport.addEventListener("wheel",e=>{
  e.preventDefault();
  const k=e.deltaY<0?1.13:1/1.13, next=Math.min(3,Math.max(.25,scale*k));
  const mx=e.clientX-innerWidth/2, my=e.clientY-innerHeight/2;
  pan.x=mx-(mx-pan.x)*(next/scale); pan.y=my-(my-pan.y)*(next/scale);
  scale=next; render();
},{passive:false});
viewport.addEventListener("dblclick",e=>{ if(!e.target.closest(".node")) fit(); });

/* ── 平移 / 拖动节点 / 点击选择 ── */
viewport.addEventListener("pointerdown",e=>{
  if(e.button!==0) return;
  const el=e.target.closest(".node"), start={x:e.clientX,y:e.clientY};
  let moved=0; const n=el?el._n:null, ox=n?n.x:0, oy=n?n.y:0;
  const mv=ev=>{
    const dx=ev.clientX-start.x, dy=ev.clientY-start.y;
    moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    if(n){ n.x=ox+dx/scale; n.y=oy+dy/scale; }
    else { pan.x+=ev.movementX; pan.y+=ev.movementY; }
    render();
  };
  const up=()=>{
    removeEventListener("pointermove",mv); removeEventListener("pointerup",up);
    if(moved<4){
      if(n){ sel=(sel===n)?null:n; mode="info"; whole=false; }
      else { sel=null; mode="overview"; }
      panelOpen=true; showDetail(); render();
    }
  };
  addEventListener("pointermove",mv); addEventListener("pointerup",up);
});
addEventListener("resize",fit);
fit();
</script>
